services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contracts
      POSTGRES_PASSWORD: contracts
      POSTGRES_DB: contracts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracts"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://contracts:contracts@db:5432/contracts
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/srv/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
