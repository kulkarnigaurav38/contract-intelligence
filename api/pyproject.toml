[project]
name = "contract-intelligence-api"
version = "0.1.0"
description = "Contract Intelligence API - Riverty RAG case study"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langgraph>=1.2.11",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
