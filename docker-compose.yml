services:
  neo4j:
    image: neo4j:2026.07
    environment:
      NEO4J_AUTH: neo4j/contracts-graph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p contracts-graph 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # a scratch instance for the end-to-end suite, which wipes its graph:
  #   docker compose --profile test up -d neo4j-test && cd api && NEO4J_TEST_URI=bolt://localhost:7688 uv run pytest tests/test_end_to_end_graph.py
  neo4j-test:
    image: neo4j:2026.07
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/contracts-graph
    ports:
      - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p contracts-graph 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  api:
    build: ./api
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: contracts-graph
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CONTRACT_STORAGE_URL: http://api:8000/api/mock-contract-storage
      DATA_DIR: /srv/data
    volumes:
      - ./data:/srv/data
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  neo4jdata:
